---
layout: default
title: 首页
---

<div class="home">
  <div class="home-header">
    <h1>Site Title</h1>
    <button id="random-project-btn" class="random-btn" aria-label="随机展示一个项目">🎲</button>
  </div>

  <p id="site-description" class="site-description">{{ site.description }}</p>

  <!-- 原有首页内容保持不动 -->
</div>

<!-- 1. 把 project 数据注入页面 -->
<script>
  window.PROJECTS = [
    {% for project in site.projects %}
      {
        "title": {{ project.title | jsonify }},
        "summary": {{ project.summary | default: project.excerpt | strip_html | jsonify }},
        "url": {{ project.url | relative_url | jsonify }}
      }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];
  window.DEFAULT_DESCRIPTION = {{ site.description | jsonify }};
</script>

<!-- 2. 随机切换 + 链接逻辑 -->
<script>
(function () {
  const btn = document.getElementById('random-project-btn');
  const desc = document.getElementById('site-description');
  if (!btn || !desc) return;

  let isTransitioning = false;

  function getRandomProject() {
    const list = window.PROJECTS || [];
    if (!list.length) return null;
    return list[Math.floor(Math.random() * list.length)];
  }

  function escapeHTML(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // title 可点击跳转，summary 为纯文本
  function buildProjectHTML(project) {
    const title = escapeHTML(project.title || '');
    const summary = escapeHTML(project.summary || '');
    const url = project.url || '#';

    return `<a class="project-link" href="${url}" title="前往 ${title}">${title}</a>` +
           (summary ? ` — ${summary}` : '');
  }

  function switchContent(html) {
    if (isTransitioning) return;
    isTransitioning = true;

    // 淡出
    desc.style.opacity = '0';
    desc.style.transform = 'translateY(-4px)';

    setTimeout(() => {
      desc.innerHTML = html;
      // 淡入
      desc.style.opacity = '1';
      desc.style.transform = 'translateY(0)';
      setTimeout(() => { isTransitioning = false; }, 300);
    }, 250);
  }

  btn.addEventListener('click', () => {
    const project = getRandomProject();
    if (!project) return;
    switchContent(buildProjectHTML(project));
  });
})();
</script>
